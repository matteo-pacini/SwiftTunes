name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Xcode 27 (Swift 6.4). Swift 6.3.3 in Xcode 26.6, the default on
    # macos-26, crashes in IR generation on Sources/SwiftTunes/Views.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
